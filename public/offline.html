<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9250" />
    <title>Sem conexão · Menuvo</title>
    <style>
      /* Página de offline autocontida: nenhum CSS externo, porque é justamente
         quando a rede falha que ela aparece. Fonte de sistema também — uma
         webfont aqui viraria um retângulo vazio no lugar do texto. */
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --card: #ffffff;
        --ink: #191b22;
        --muted: #6c7080;
        --brand: #0f9250;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f14;
          --card: #191b22;
          --ink: #f7f7f8;
          --muted: #b9bbc5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border-radius: 20px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 8px 32px -16px rgba(16, 24, 40, 0.24);
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #1bb563, #0c4b30);
        display: grid;
        place-items: center;
      }
      .mark svg { width: 60%; height: 60%; color: #eefdf3; }
      h1 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 6px; color: var(--muted); font-size: 0.9375rem; line-height: 1.55; }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:active { transform: scale(0.99); }
      .hint { margin-top: 14px; font-size: 0.8125rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M7 4v8.5A2.5 2.5 0 0 0 9.5 15v5M9.5 4v5.5" />
          <path d="M16.5 4c1.6 0 2.5 1.7 2.5 4s-.9 3.6-1.8 3.9V20" />
          <path d="M3 3l18 18" stroke-width="1.4" opacity="0.55" />
        </svg>
      </div>
      <h1>Você está sem conexão</h1>
      <p>O Menuvo precisa de internet para abrir o cardápio atualizado e os pedidos.</p>
      <p class="hint">Se estiver no salão, avise a equipe — eles continuam vendo os pedidos que já chegaram.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
